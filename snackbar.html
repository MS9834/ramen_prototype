  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #1b0f0a; overflow: hidden; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Galmuri11", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  /* 게임 판: 세로 9:16 비율로 화면에 꽉 맞춘다 */
  #game {
    position: relative;
    width: min(100vw, calc(100dvh * 9 / 16));
    height: min(100dvh, calc(100vw * 16 / 9));
    overflow: hidden;
    background: #2b1a12;
    container-type: size;   /* 떠오르는 글씨 크기를 게임 판 너비에 맞춘다 (cqw) */
  }
  #view {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  .pixel { image-rendering: pixelated; image-rendering: crisp-edges; }

  /* 아래쪽 라면 버튼 두 개: 동그란 2.5D 버튼 위에 회사 컵라면 뚜껑 그림을 덮었다 (v3, 픽셀화하지 않음) */
  #buttons {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 3%;
    display: flex;
    justify-content: space-around;
    padding: 0 5%;
  }
  .ramen-btn {
    position: relative;
    width: 40%;
    aspect-ratio: 1 / 0.96;
    border: none;
    background: none;
    cursor: pointer;
    touch-action: manipulation;
  }
  .ramen-btn > * { pointer-events: none; }
  /* 바닥 그림자 */
  .ramen-btn::before {
    content: '';
    position: absolute;
    left: 6%;
    right: 6%;
    bottom: -4%;
    height: 34%;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.5);
    filter: blur(3px);
  }
  /* 버튼 옆면(두께) */
  .ramen-btn .side {
    position: absolute;
    left: 0;
    right: 0;
    top: 12%;
    height: 86%;
    border-radius: 50%;
    background: linear-gradient(90deg, var(--d) 0%, var(--m) 28%, var(--l) 50%, var(--m) 72%, var(--d) 100%);
    box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.35);
  }
  /* 윗면: 뚜껑 그림 */
  .ramen-btn .face {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 86%;
    border-radius: 50%;
    overflow: hidden;
    transition: top 0.05s;
  }
  .ramen-btn .face img { display: block; width: 100%; height: 100%; object-fit: fill; }
  /* 윗면 테두리와 반짝임 */
  .ramen-btn .face::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.9), inset 0 -8px 12px rgba(0, 0, 0, 0.22);
    background: radial-gradient(ellipse at 32% 20%, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0) 42%);
  }
  .ramen-btn.press .face { top: 10%; }
  #btn-A { --d: #8e1f12; --m: #d8402a; --l: #f2803e; }
  #btn-B { --d: #3a160c; --m: #6e2e1a; --l: #a0532e; }
  #game:not(.playing) #buttons { visibility: hidden; }
  /* v12: 피버가 끝난 직후 잠깐 버튼을 막는다 (흐리게) */
  #buttons.locked .ramen-btn { opacity: 0.45; filter: grayscale(0.7); }

  /* 맞게 주면 손님 머리 위로 떠오르는 대사 (v3) */
  #float-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .float-text {
    position: absolute;
    white-space: nowrap;
    font-size: 34px;
    font-size: 9cqw;
    font-weight: 700;
    letter-spacing: -0.03em;
    -webkit-text-stroke: 1.6cqw #2b1a12;
    paint-order: stroke fill;
    text-shadow: 0 1cqw 0 #2b1a12;
    animation: float-up 0.9s ease-out forwards;
  }
  @keyframes float-up {
    0%   { opacity: 0; transform: translate(-50%, 40%) scale(0.5); }
    15%  { opacity: 1; transform: translate(-50%, 0) scale(1.15); }
    30%  { transform: translate(-50%, -10%) scale(1); }
    75%  { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -110%) scale(1); }
  }

  /* 시작·결과 화면 (게임 판 위에 덮는다) */
  .panel {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 0 8%;
    background: rgba(27, 15, 10, 0.78);
    color: #fff4dc;
    text-align: center;
  }
  .panel.show { display: flex; }
  .panel h1 {
    font-size: 34px;
    font-weight: 700;
    color: #ffd23f;
    text-shadow: 3px 3px 0 #b8321b, -2px -2px 0 #2b1a12, 2px -2px 0 #2b1a12, -2px 2px 0 #2b1a12;
    letter-spacing: 1px;
  }
  .panel h2 { font-size: 24px; font-weight: 700; color: #ffd23f; text-shadow: 3px 3px 0 #b8321b; }
  .panel .cups { display: flex; gap: 10px; }
  .panel .cups img { width: 96px; height: 92px; object-fit: contain; filter: drop-shadow(0 4px 0 rgba(0, 0, 0, 0.4)); }
  .howto {
    width: 100%;
    padding: 12px 14px;
    border: 3px solid #fff4dc;
    background: #3a2318;
    font-size: 14px;
    line-height: 1.6;
    text-align: left;
    box-shadow: 4px 4px 0 #000;
  }
  .howto b { color: #ffd23f; }
  .pixel-btn {
    padding: 12px 34px;
    border: 3px solid #2b1a12;
    background: #3fbf4f;
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    font-family: inherit;
    box-shadow: inset -4px -4px 0 #24873a, inset 4px 4px 0 #7be08a, 4px 4px 0 #000;
    cursor: pointer;
  }
  .pixel-btn:active { transform: translate(2px, 2px); box-shadow: inset -4px -4px 0 #24873a, inset 4px 4px 0 #7be08a, 2px 2px 0 #000; }
  .big-num { font-size: 56px; font-weight: 700; color: #fff; text-shadow: 4px 4px 0 #b8321b; line-height: 1; }
  .sub { font-size: 16px; }

  /* v8: 시작 화면 위쪽 배너 (제품 보러가기) */
  .promo-banner {
    position: absolute;
    top: 3%;
    left: 6%;
    right: 6%;
    padding: 10px 12px;
    border: 3px solid #2b1a12;
    background: #ffd23f;
    color: #b8321b;
    font-size: 17px;
    font-weight: 700;
    text-align: center;
    text-decoration: none;
    box-shadow: inset -3px -3px 0 #e0a800, inset 3px 3px 0 #fff1a8, 4px 4px 0 #000;
    cursor: pointer;
    animation: banner-bounce 1.2s ease-in-out infinite;
  }
  .promo-banner:active { transform: translate(2px, 2px); box-shadow: inset -3px -3px 0 #e0a800, inset 3px 3px 0 #fff1a8, 2px 2px 0 #000; animation: none; }
  @keyframes banner-bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

  /* v8: 결과 화면 '내 점수 기록하기' */
  .record {
    width: 100%;
    padding: 12px 14px;
    border: 3px solid #fff4dc;
    background: #3a2318;
    box-shadow: 4px 4px 0 #000;
  }
  .record-title { margin-bottom: 8px; font-size: 16px; font-weight: 700; color: #ffd23f; }
  .record-row { display: flex; gap: 8px; }
  .record-row input {
    flex: 1;
    min-width: 0;
    padding: 8px 10px;
    border: 3px solid #2b1a12;
    background: #fff;
    color: #2b1a12;
    font-size: 16px;   /* 16px보다 작으면 아이폰이 화면을 확대한다 */
    font-family: inherit;
    border-radius: 0;
  }
  .pixel-btn.small { padding: 8px 16px; font-size: 16px; }

  /* v8: 안내 알림 창 */
  .notice {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 0 10%;
    background: rgba(0, 0, 0, 0.55);
    z-index: 10;
  }
  .notice.show { display: flex; }
  .notice-box {
    width: 100%;
    padding: 20px 16px 16px;
    border: 3px solid #2b1a12;
    background: #fff4dc;
    color: #2b1a12;
    text-align: center;
    box-shadow: 4px 4px 0 #000;
  }
  .notice-box p { margin-bottom: 14px; font-size: 17px; font-weight: 400; line-height: 1.5; }
</style>
</head>

  const LINES = { A: ['매콤치즈!', '맛있게 맵다!'], B: ['사천짜장!', '맛있게 맵다!'] };
  const LINE_COLOR = { '매콤치즈!': '#ffd23f', '사천짜장!': '#ffb02e', '맛있게 맵다!': '#ff5a3a' };
  const lineTurn = { A: 0, B: 0 };
  const floatLayer = document.getElementById('float-layer');
  function floatLine(type) {
    const text = LINES[type][lineTurn[type]++ % LINES[type].length];
    const el = document.createElement('div');
    el.className = 'float-text';
    el.textContent = text;
    el.style.color = LINE_COLOR[text];
    // 다음 손님 주문 말풍선을 가리지 않게, 떠나는 손님 쪽(가운데 아래)에 띄운다

    floatLayer.appendChild(el);

  }

  // ===== 소리 (파일 없이 브라우저에서 만든 임시 효과음) =====
  let audio = null;
  function initAudio() {
    if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; } }
    if (audio && audio.state === 'suspended') audio.resume();
    decodeVoices();
  }
  function tone(freq, start, dur, type, vol, slideTo) {
    if (!audio) return;
    const t = audio.currentTime + start;
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol || 0.12, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(audio.destination);
    o.start(t);
    o.stop(t + dur);
  }

  // ===== BGM (v5): 파일 없이 코드로 만든 1분짜리 8비트 곡. 끝나면 처음부터 반복 =====
  // 120 BPM, 4/4박자 30마디 = 정확히 60초. 구성: A(8마디) → B(8) → A(8) → C(6)
  // 멜로디 표기: 한 마디 = 8분음표 8칸. 음 이름(C5, F#4…), '_' = 앞 음 이어서, '-' = 쉼
  const BGM_BPM = 120;
  const BGM_VOL = 0.55;          // BGM 전체 크기 (효과음보다 작게)
  const FEVER_SPEED = 1.35;      // 피버 동안 BGM 빠르기 배수
  const MEL = {
    A1: 'C5 _ E5 G5 C6 _ G5 E5', A2: 'A4 _ C5 E5 A5 _ E5 C5', A3: 'F5 _ A5 F5 C5 _ A4 C5', A4: 'D5 _ G5 _ B5 _ D6 -',
    A5: 'C6 _ G5 E5 C5 _ E5 G5', A6: 'A5 _ E5 C5 A4 _ C5 E5', A7: 'F5 A5 C6 A5 F5 _ G5 A5', A8: 'G5 _ _ _ - D5 E5 F5',
    B1: 'A5 _ G5 F5 A5 _ G5 F5', B2: 'G5 _ F5 E5 D5 _ B4 D5', B3: 'E5 _ G5 B5 E6 _ B5 G5', B4: 'A5 _ C6 A5 E5 _ C5 E5',
    B5: 'F5 _ A5 C6 F6 _ C6 A5', B6: 'G5 _ B5 D6 G6 _ F6 D6', B7: 'E6 _ D6 C6 G5 _ E5 G5', B8: 'C6 _ _ _ - - G5 _',
    C1: 'D5 F5 A5 F5 D6 _ A5 F5', C2: 'G5 B5 D6 B5 G5 _ D5 G5', C3: 'E5 G5 B5 G5 E6 _ B5 G5', C4: 'A5 C6 E6 C6 A5 _ E5 C5',
    C5: 'F5 _ A5 _ D6 _ F6 _', C6: 'G5 _ D6 _ B5 _ G5 -',
  };
  const CHORD = { C: ['C', 'E', 'G'], Am: ['A', 'C', 'E'], F: ['F', 'A', 'C'], G: ['G', 'B', 'D'], Em: ['E', 'G', 'B'], Dm: ['D', 'F', 'A'] };
  // [멜로디, 화음, 마지막 마디(드럼 채우기)]
  const SONG = [
    ['A1', 'C'], ['A2', 'Am'], ['A3', 'F'], ['A4', 'G'], ['A5', 'C'], ['A6', 'Am'], ['A7', 'F'], ['A8', 'G', 1],
    ['B1', 'F'], ['B2', 'G'], ['B3', 'Em'], ['B4', 'Am'], ['B5', 'F'], ['B6', 'G'], ['B7', 'C'], ['B8', 'C', 1],
    ['A1', 'C'], ['A2', 'Am'], ['A3', 'F'], ['A4', 'G'], ['A5', 'C'], ['A6', 'Am'], ['A7', 'F'], ['A8', 'G', 1],
    ['C1', 'Dm'], ['C2', 'G'], ['C3', 'Em'], ['C4', 'Am'], ['C5', 'Dm'], ['C6', 'G', 1],
  ];
  const SEMI = { C: 0, 'C#': 1, D: 2, 'D#': 3, E: 4, F: 5, 'F#': 6, G: 7, 'G#': 8, A: 9, 'A#': 10, B: 11 };
  function freqOf(name, oct) {
    const m = /^([A-G]#?)(\d)?$/.exec(name);
    const o = m[2] != null ? Number(m[2]) : oct;
    return 440 * Math.pow(2, (SEMI[m[1]] + (o + 1) * 12 - 69) / 12);
  }
  const STEPS = SONG.map(([mel]) => MEL[mel].split(' '));
  const TOTAL_STEPS = SONG.length * 8;

  let bgmGain = null, bgmTimer = null, bgmStep = 0, bgmNext = 0, noiseBuf = null;
  function bgmNote(freq, t, dur, type, vol) {
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t);
    g.gain.setValueAtTime(vol, t + dur * 0.7);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(bgmGain);
    o.start(t);
    o.stop(t + dur + 0.02);
  }
  function bgmNoise(t, dur, vol, hp) {
    const src = audio.createBufferSource(), f = audio.createBiquadFilter(), g = audio.createGain();
    src.buffer = noiseBuf;
    f.type = 'highpass'; f.frequency.value = hp;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f).connect(g).connect(bgmGain);
    src.start(t);
    src.stop(t + dur);
  }
  function bgmKick(t) {
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    g.gain.setValueAtTime(0.5, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    o.connect(g).connect(bgmGain);
    o.start(t);
    o.stop(t + 0.16);
  }
  // 한 칸(8분음표) 연주
  function bgmPlayStep(i, t, step) {
    const bar = Math.floor(i / 8), k = i % 8;
    const [, chordName, fill] = SONG[bar];
    const chord = CHORD[chordName];
    const notes = STEPS[bar];
    // 멜로디: 뒤따르는 '_' 만큼 길게
    const tok = notes[k];
    if (tok !== '-' && tok !== '_') {
      let len = 1;
      while (k + len < 8 && notes[k + len] === '_') len++;
      bgmNote(freqOf(tok), t, step * len * 0.95, 'square', 0.07);
    }
    // 베이스: 근음과 한 옥타브 위를 번갈아
    bgmNote(freqOf(chord[0], k % 2 ? 3 : 2), t, step * 0.8, 'triangle', 0.22);

    if (k % 2) chord.forEach(n => bgmNote(freqOf(n, 4), t, step * 0.45, 'square', 0.018));

  let voiceSrc = null;
  for (const v of Object.values(VOICES)) {
    fetch(v.url).then(r => r.arrayBuffer()).then(b => { v.data = b; decodeVoices(); }).catch(() => {});
  }
  function decodeVoices() {
    if (!audio) return;
    for (const v of Object.values(VOICES)) {
      if (!v.data || v.buf) continue;
      const data = v.data;
      v.data = null;
      audio.decodeAudioData(data, b => { v.buf = b; }, () => {});
    }
  }
  function playVoice(name) {
    if (!audio) return;
    const v = VOICES[name];
    if (!v.buf) { v.fallback(); return; }   // 소리 파일을 아직 못 읽었으면 예전 효과음
    try { if (voiceSrc) voiceSrc.stop(); } catch (e) {}   // 빨리 연달아 나면 앞 목소리를 끊고 새로 낸다
    voiceSrc = audio.createBufferSource();
    voiceSrc.buffer = v.buf;
    voiceSrc.connect(audio.destination);
    voiceSrc.start();
  }

  // s = 크기 단계 (1단계 = 7칸). 큰 글씨는 굵게(Bold, 700)가 기본, 일반체는 weight 400
  const FONT_NAME = 'Galmuri11';
  const fontOf = (s, weight) => (weight || 700) + ' ' + (s * 7) + 'px ' + FONT_NAME + ', sans-serif';
  document.fonts && ['400', '700'].forEach(w => document.fonts.load(w + ' 14px ' + FONT_NAME));
  function textWidth(str, s, weight) { ctx.font = fontOf(s, weight); return ctx.measureText(str).width; }
  // 테두리(outline)를 두른 글씨. outline이 없으면 테두리 없이 그린다
  function pixelText(str, x, y, s, color, outline, weight) {
    ctx.font = fontOf(s, weight);
    ctx.textBaseline = 'top';
    ctx.textAlign = 'left';
    if (outline) {
      ctx.lineJoin = 'round';
      ctx.lineWidth = Math.max(1.5, s * 1.1);
      ctx.strokeStyle = outline;
      ctx.strokeText(str, x, y);
    }
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
  }

    const menu = (x) => {

      for (let i = 0; i < 4; i++) { rect('#fff4dc', x + 5, 69 + i * 8, 14, 2); rect('#ffd23f', x + 23, 69 + i * 8, 6, 2); }
    };
    menu(6); menu(140);
    // 가운데 주방 창 (김이 나는 냄비)
    rect('#2b1a12', 52, 64, 76, 46);
    rect('#7a4a2e', 54, 66, 72, 42);

    rect('#c98b55', 0, 120, W, H - 120);
    for (let row = 0; row < 14; row++) {
      const y0 = 120 + Math.pow(row / 14, 1.6) * 200, y1 = 120 + Math.pow((row + 1) / 14, 1.6) * 200;
      for (let col = -8; col < 8; col++) {
        if ((row + col) % 2 === 0) continue;
        const spread0 = 0.45 + row / 14 * 1.4, spread1 = 0.45 + (row + 1) / 14 * 1.4;
        const xa = 90 + col * 14 * spread0, xb = 90 + (col + 1) * 14 * spread0;
        const xc = 90 + (col + 1) * 14 * spread1, xd = 90 + col * 14 * spread1;
        b.fillStyle = '#b5774a';
        b.beginPath(); b.moveTo(xa, y0); b.lineTo(xb, y0); b.lineTo(xc, y1); b.lineTo(xd, y1); b.fill();
      }
    }
    // 벽과 바닥 사이 걸레받이

  const CELL = 256, CHAR_TOP = 8, CHAR_H = 240;

  const NPC_LOOKS = [4, 5];                   // 남자·여자 손님: 라면 1개 주문
  const SPECIAL_LOOKS = [0, 1, 2, 3];         // 윤석·성훈·민지·돌돌: 특별 주문 (여러 개 / 두 종류)
  const NPC_RATE = 0.8;                       // 남자·여자 손님이 나올 확률 (나머지 20%는 특별 손님)
  const MAX_EACH = 5;                         // 특별 주문: 라면 한 종류당 최대 개수
  const MAX_TOTAL = 10;                       // 특별 주문: 두 종류 합쳐 최대 개수
  const PATIENCE_PER_ITEM = 0.35;             // 특별 주문은 라면 1개 늘 때마다 기다려 주는 시간 +35%
  const MOOD_COL = { normal: 0, angry: 1, happy: 2 };   // 주문 중, 실패, 성공
  const spriteCache = {};
  function personSprite(look, mood) {
    const key = look + mood;
    if (spriteCache[key]) return spriteCache[key];
    const c = document.createElement('canvas');
    c.width = CELL; c.height = CHAR_H;
    if (!ATLAS.complete || !ATLAS.naturalWidth) return c;   // 그림을 아직 못 불러왔으면 빈 그림 (저장하지 않음)
    c.getContext('2d').drawImage(ATLAS, MOOD_COL[mood] * CELL, look * CELL + CHAR_TOP, CELL, CHAR_H, 0, 0, CELL, CHAR_H);
    spriteCache[key] = c;
    return c;
  }

  // 줄 서는 자리: 0번이 맨 앞(크게), 뒤로 갈수록 작고 위쪽
  const SLOTS = [
    { y: 246, s: 3.4 },
    { y: 178, s: 2.2 },
    { y: 150, s: 1.6 },
    { y: 134, s: 1.2 },
    { y: 124, s: 0.9 },
  ];
  function slotAt(p) {
    const i = Math.max(0, Math.min(SLOTS.length - 1.001, p));
    const a = SLOTS[Math.floor(i)], b = SLOTS[Math.ceil(i)] || a, t = i - Math.floor(i);
    return { y: a.y + (b.y - a.y) * t, s: a.s + (b.s - a.s) * t };
  }

  // ===== 게임 상태 =====
  let state = 'title';
  let timeLeft = 0, served = 0, combo = 0, maxCombo = 0, elapsed = 0;
  let fever = 0;            // 남은 피버 시간(초)
  let feverCount = 0;       // 피버 추첨용 콤보 수. 피버가 끝나거나 콤보가 끊기면 0부터 다시 센다 (v12)
  let lockTime = 0;         // 남은 버튼 막힘 시간(초) (v12)
  let queue = [];           // 줄 선 손님들 (0번이 맨 앞)
  let leaving = [];         // 떠나는 손님들 (애니메이션용)
  let effects = [];         // 불꽃, 글자, 날아가는 라면
  let comboPop = 0, shake = 0, penaltyFlash = 0;
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const randInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

  // 주문 = { A: 라볶이 개수, B: 짜장 개수 }
  function makeOrder(special) {
    if (!special) return Math.random() < 0.5 ? { A: 1, B: 0 } : { A: 0, B: 1 };
    let o;
    if (Math.random() < 0.5) {
      // 한 종류만 여러 개 (2~5개)
      const n = randInt(2, MAX_EACH);
      o = Math.random() < 0.5 ? { A: n, B: 0 } : { A: 0, B: n };
    } else {
      // 두 종류를 함께 (각 1~5개)
      o = { A: randInt(1, MAX_EACH), B: randInt(1, MAX_EACH) };
    }
    while (o.A + o.B > MAX_TOTAL) { if (o.A >= o.B) o.A--; else o.B--; }
    return o;
  }

  function newCustomer() {
    const special = Math.random() >= NPC_RATE;
    const order = makeOrder(special);
    const total = order.A + order.B;
    return {
      look: special ? pick(SPECIAL_LOOKS) : pick(NPC_LOOKS),
      special,
      order,                          // 처음 주문
      need: { A: order.A, B: order.B },   // 아직 덜 준 개수
      pmul: 1 + PATIENCE_PER_ITEM * (total - 1),
      patience: 1,                    // 1 = 100%, 0 = 다 떨어짐
      pos: SLOTS.length - 1 + 0.6,    // 뒤에서 걸어 들어온다
      bob: Math.random() * 6,
    };
  }
  const remaining = c => c.need.A + c.need.B;
  function patienceTime() {
    const t = Math.min(1, elapsed / GAME_TIME);
    return PATIENCE_START + (PATIENCE_END - PATIENCE_START) * t;
  }

  function startGame() {
    initAudio();
    bgmStart();
    state = 'play';
    timeLeft = GAME_TIME; served = 0; combo = 0; maxCombo = 0; elapsed = 0; fever = 0; feverCount = 0; lockTime = 0;
    queue = []; leaving = []; effects = [];
    floatLayer.innerHTML = '';
    for (let i = 0; i < SLOTS.length; i++) { const c = newCustomer(); c.pos = i; queue.push(c); }
    document.getElementById('start-panel').classList.remove('show');
    document.getElementById('result-panel').classList.remove('show');
    game.classList.add('playing');
  }

  function endGame() {
    state = 'end';
    game.classList.remove('playing');
    bgmStop();
    sfx.end();
    document.getElementById('result-served').textContent = served;
    document.getElementById('result-combo').textContent = maxCombo;
    setTimeout(() => document.getElementById('result-panel').classList.add('show'), 600);
  }

  // 맨 앞 손님을 보내고 줄을 한 칸씩 당긴다
  function nextCustomer(mood) {
    const c = queue.shift();

    c.t = 0;
    leaving.push(c);
    queue.push(newCustomer());
  }

  function penalty(text) {
    timeLeft = Math.max(0, timeLeft - PENALTY);
    combo = 0;
    feverCount = 0;
    shake = 0.25;
    penaltyFlash = 0.6;
    effects.push({ kind: 'text', text: '-' + PENALTY + 'S', x: 40, y: 22, t: 0, life: 0.9, color: '#ff4a3a', s: 2 });
  }

  function serve(type) {
    if (state !== 'play' || lockTime > 0) return;   // 피버가 끝난 직후에는 버튼이 막힌다
    const c = queue[0];
    const btn = document.getElementById('btn-' + type);
    btn.classList.add('press');
    setTimeout(() => btn.classList.remove('press'), 90);

    // 버튼 위치에서 손님 쪽으로 라면이 날아간다
    const gr = game.getBoundingClientRect(), br = btn.getBoundingClientRect();
    const fx = (br.left + br.width / 2 - gr.left) / gr.width * W;
    const fy = (br.top + br.height / 2 - gr.top) / gr.height * H;
    effects.push({ kind: 'fly', type, x0: fx, y0: fy, x1: 90, y1: 200, t: 0, life: 0.22 });

    if (fever > 0) {
      // 피버: 아무 버튼이나 한 번 누르면 주문 전체 완성 (특별 주문도 1콤보)
      served += remaining(c);
      completeOrder(type);
    } else if (c.need[type] > 0) {
      c.need[type]--;
      served++;
      if (remaining(c) === 0) completeOrder(type);
      else sfx.pop();   // 특별 주문: 아직 남았다
    } else {
      playVoice('ahh');   // 주문 실패 (v14: 삑 소리 대신 Ahh)
      penalty();
      nextCustomer('angry');
    }
  }

  // 주문을 다 받은 손님: 1콤보 (라면을 몇 개 주문했든 1콤보)
  function completeOrder(type) {
    combo++;
    maxCombo = Math.max(maxCombo, combo);
    comboPop = 0.2;
    playVoice('yeah');
    floatLine(type);
    nextCustomer('happy');   // 떠나는 손님이 입에서 불을 뿜는다 (update에서 불꽃을 만든다)
    // 피버 추첨 (v12): 피버 중에는 세지도, 추첨하지도 않는다.
    // 피버가 끝난(또는 콤보가 끊긴) 뒤부터 0, 1, 2…로 다시 세어 20, 40…째에 40% 확률
    if (fever <= 0) {
      feverCount++;
      if (feverCount % FEVER_STEP === 0 && Math.random() < FEVER_CHANCE) {
        fever = FEVER_TIME;
        sfx.fever();
        effects.push({ kind: 'text', text: 'FEVER!', x: 90, y: 96, t: 0, life: 1.2, color: '#ff4fd8', s: 4, center: true });
      }
    }
  }

  const buttonsEl = document.getElementById('buttons');
  // 손가락이 닿는 순간 바로 반응하도록 pointerdown을 쓴다
  for (const type of ['A', 'B']) {
    const btn = document.getElementById('btn-' + type);
    btn.addEventListener('pointerdown', e => { e.preventDefault(); serve(type); });
  }
  // PC에서 시험할 때: 왼쪽/오른쪽 화살표, 또는 1/2 키
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === '1') serve('A');
    if (e.key === 'ArrowRight' || e.key === '2') serve('B');
  });
  document.getElementById('start-btn').addEventListener('click', startGame);
  document.getElementById('again-btn').addEventListener('click', startGame);

  // ===== v8: 제품 보러가기 배너, 점수 기록하기 =====
  const PRODUCT_URL = '';   // 제품 페이지 주소를 받으면 여기에 넣는다. 비어 있으면 '준비 중' 알림
  function showNotice(text) {
    document.getElementById('notice-text').textContent = text;
    document.getElementById('notice').classList.add('show');
  }
  document.getElementById('notice-ok').addEventListener('click', () => document.getElementById('notice').classList.remove('show'));
  document.getElementById('promo-banner').addEventListener('click', e => {
    if (PRODUCT_URL) { e.currentTarget.href = PRODUCT_URL; e.currentTarget.target = '_blank'; return; }
    e.preventDefault();
    showNotice('제품 페이지를 준비하고 있어요!');
  });
  const nickInput = document.getElementById('nickname');
  function recordScore() {
    const nick = nickInput.value.trim();
    if (!nick) { showNotice('닉네임을 적어 주세요.'); return; }
    nickInput.blur();   // 휴대폰 키보드를 내린다
    // 랭킹(Google 스프레드시트 저장)은 아직 만들지 않았다. 지금은 알림만 띄운다
    showNotice('아직 랭킹 보기는 구현 중이에요!');
  }
  document.getElementById('record-btn').addEventListener('click', recordScore);
  nickInput.addEventListener('keydown', e => { if (e.key === 'Enter') recordScore(); });

  // ===== 매 화면 갱신 =====
  function update(dt) {
    if (state === 'play') {
      elapsed += dt;
      lockTime = Math.max(0, lockTime - dt);
      buttonsEl.classList.toggle('locked', lockTime > 0);
      timeLeft -= dt;
      if (fever > 0) {
        fever = Math.max(0, fever - dt);
        // 피버가 끝나는 순간 FEVER TIME OVER 표시, 잘못 누르지 않게 잠깐 버튼을 막는다 (BGM도 원래 빠르기로 돌아온다)
        if (fever === 0) {
          sfx.feverOver();
          feverCount = 0;
          lockTime = OVER_LOCK;
          effects.push({ kind: 'text', text: 'FEVER TIME OVER', x: 90, y: 96, t: 0, life: 1.2, color: '#7fd4ff', s: 2.5, center: true });
        }
      }
      const c = queue[0];
      if (c && c.pos < 0.3 && fever <= 0 && lockTime <= 0) {
        c.patience -= dt / (patienceTime() * c.pmul);
        if (c.patience <= 0) {
          playVoice('ahh');   // 기다리다 지쳐 떠남 = 주문 실패 (v14)
          penalty();
          nextCustomer('angry');
        }
      }
      if (timeLeft <= 0) { timeLeft = 0; endGame(); }
    }
    // 줄 당기기: 각자 자기 자리로 빠르게 이동
    queue.forEach((c, i) => { c.pos += (i - c.pos) * Math.min(1, dt * 14); c.bob += dt; });
    leaving.forEach(c => {
      c.t += dt;
      // 맛있게 매워서 입에서 불을 뿜는다 (처음 0.4초 동안)
      if (c.mood === 'happy' && c.t < 0.4) {
        const k = c.t / 0.5, sl = SLOTS[0];
        const hop = Math.round(Math.sin(k * Math.PI) * 10);
        const mx = 90 + k * 110, my = sl.y - hop - SPRITE_H * sl.s + 10 * sl.s;
        for (let i = 0; i < Math.ceil(dt * 220); i++) {
          effects.push({ kind: 'fire', x: mx + (Math.random() - 0.5) * 6, y: my, vx: 180 + (Math.random() - 0.5) * 120,
            vy: -150 - Math.random() * 110, t: 0, life: 0.35 + Math.random() * 0.3, size: 4 + Math.floor(Math.random() * 4) });
        }
      }
    });
    leaving = leaving.filter(c => c.t < 0.5);
    effects.forEach(e => { e.t += dt; if (e.vx != null) { e.x += e.vx * dt; e.y += e.vy * dt; } });
    effects = effects.filter(e => e.t < e.life);
    comboPop = Math.max(0, comboPop - dt);
    shake = Math.max(0, shake - dt);
    penaltyFlash = Math.max(0, penaltyFlash - dt);
  }

  function drawPerson(c, x, y, s, mood, alpha) {
    const sp = personSprite(c.look, mood || 'normal');
    // v13: 고해상도 아틀라스라 정해진 크기 그대로 그린다.
    // 키우는 경우(맨 앞 손님 등)는 도트를 또렷하게, 줄이는 경우(뒤쪽 손님)는 부드럽게 줄여 깨지지 않게 한다
    const q = v => Math.round(v * SCALE) / SCALE;
    const k = s * ATLAS_K;                       // 원본 1칸 → 게임 칸
    const w = sp.width * k, h = sp.height * k;
    const shrink = k * SCALE < 1;                // 원본 1칸이 화면 픽셀 1개보다 작아지면 '줄이기'
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    // 그림자
    ctx.fillStyle = 'rgba(43,26,18,0.25)';
    ctx.fillRect(q(x - w * 0.25), q(y - s), q(w * 0.5), q(s * 2));
    ctx.imageSmoothingEnabled = shrink;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(sp, q(x - w / 2), q(y - h), w, h);
    ctx.imageSmoothingEnabled = false;
    ctx.globalAlpha = 1;
  }

  // 불꽃 한 알: 하얀 노랑 → 노랑 → 주황 → 빨강으로 식으며 커진다
  function drawFire(e) {
    const k = e.t / e.life;
    ctx.globalAlpha = 1 - k * 0.6;
    ctx.fillStyle = k < 0.12 ? '#fff6b0' : k < 0.3 ? '#ffd23f' : k < 0.6 ? '#ff7a1a' : '#e8301a';
    const sz = Math.round(e.size * (1 + k * 0.6));
    ctx.fillRect(Math.round(e.x - sz / 2), Math.round(e.y - sz / 2), sz, sz);
    ctx.globalAlpha = 1;
  }

  // 말풍선: 원하는 라면 그림(특별 주문은 남은 개수까지) + 인내심 게이지
  function drawBubble(c, headY) {
    // 특별 주문은 라면 종류마다 한 줄: [라면 그림] X남은 개수 (v11: 개수를 그림 옆에 크게)
    const rows = c.special ? ['A', 'B'].filter(t => c.order[t] > 0) : [];
    const rowH = rows.length === 2 ? 26 : 34;
    const bw = c.special ? 72 : 52, bh = c.special ? rows.length * rowH + 16 : 50, x = 90 - bw / 2, y = Math.round(headY - bh - 10);
    const O = '#2b1a12';
    ctx.fillStyle = O;
    ctx.fillRect(x - 1, y + 1, bw + 2, bh - 2); ctx.fillRect(x + 1, y - 1, bw - 2, bh + 2);
    ctx.fillStyle = '#fff';
    ctx.fillRect(x, y + 1, bw, bh - 2); ctx.fillRect(x + 1, y, bw - 2, bh);
    // 꼬리
    ctx.fillStyle = O; ctx.fillRect(86, y + bh, 8, 2); ctx.fillRect(88, y + bh + 2, 4, 2); ctx.fillRect(89, y + bh + 4, 2, 2);
    ctx.fillStyle = '#fff'; ctx.fillRect(87, y + bh - 1, 6, 2); ctx.fillRect(89, y + bh + 1, 2, 2);
    if (c.special) {
      // 특별 주문: 줄마다 라면 그림 + 바로 옆에 "X남은 개수". 다 준 라면은 흐리게
      rows.forEach((t, i) => {
        const top = y + 3 + i * rowH, mid = top + rowH / 2, left = c.need[t];
        const icon = rowH - 2;
        ctx.globalAlpha = left > 0 ? 1 : 0.3;
        drawSmooth(RAMEN[t].icon, x + 5 + icon / 2, mid, icon, icon);
        pixelText('X' + left, x + 9 + icon, Math.round(mid - 10), 3, '#000', null, 400);   // 남은 개수: 일반체, 검은색
        ctx.globalAlpha = 1;
      });
    } else {
      // 라면 1개 주문 (피버 때는 둘 다 OK라 번갈아 보여 준다)
      const want = fever > 0 ? (Math.floor(performance.now() / 150) % 2 ? 'A' : 'B') : (c.need.A ? 'A' : 'B');
      drawSmooth(RAMEN[want].icon, 90, y + 3 + 19, 40, 38);
    }
    // 인내심 게이지: 100~80 초록, 79~50 주황, 49~1 빨강
    const p = Math.max(0, c.patience) * 100;
    const gx = x + 4, gy = y + bh - 9, gw = bw - 8;
    ctx.fillStyle = O; ctx.fillRect(gx - 1, gy - 1, gw + 2, 7);
    ctx.fillStyle = '#5a4a40'; ctx.fillRect(gx, gy, gw, 5);
    ctx.fillStyle = fever > 0 ? '#ff4fd8' : p >= 80 ? '#3fdc4f' : p >= 50 ? '#ff9f1a' : '#ff3b3b';
    ctx.fillRect(gx, gy, Math.ceil(gw * p / 100), 5);
    ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.fillRect(gx, gy, Math.ceil(gw * p / 100), 1);
  }

  function drawHUD() {
    // 왼쪽 위: 시계와 남은 시간 막대
    const O = '#2b1a12';
    ctx.fillStyle = O; ctx.fillRect(4, 31, 14, 14); ctx.fillRect(5, 30, 12, 16);
    ctx.fillStyle = '#fff'; ctx.fillRect(6, 32, 10, 12); ctx.fillRect(5, 33, 12, 10);
    ctx.fillStyle = O; ctx.fillRect(10, 34, 2, 5); ctx.fillRect(10, 38, 4, 2);
    const bw = 64, ratio = Math.max(0, timeLeft) / GAME_TIME;
    ctx.fillStyle = O; ctx.fillRect(20, 33, bw + 2, 10);
    ctx.fillStyle = '#3a2318'; ctx.fillRect(21, 34, bw, 8);
    ctx.fillStyle = penaltyFlash > 0 && Math.floor(penaltyFlash * 12) % 2 ? '#ff3b3b' : ratio < 0.25 ? '#ff9f1a' : '#3fdc4f';
    ctx.fillRect(21, 34, Math.ceil(bw * ratio), 8);
    ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fillRect(21, 34, Math.ceil(bw * ratio), 2);
    pixelText(String(Math.ceil(timeLeft)), 90, 34, 2, '#fff', O);

    // 왼쪽 아래 위: 준 라면 수
    const ic = RAMEN.A.icon;
    drawSmooth(ic, 12, 58, 17, 17);
    pixelText(String(served), 22, 54, 2, '#ffd23f', O);

    // 오른쪽: 콤보
    if (combo > 0) {
      const s = comboPop > 0 ? 4 : 3;
      const num = String(combo);
      pixelText(num, W - 6 - textWidth(num, s), 60 - (s - 3) * 2, s, fever > 0 ? '#ff4fd8' : '#ffd23f', O);
      pixelText('COMBO', W - 6 - textWidth('COMBO', 1), 80, 1, '#fff', O);
    }
  }

  function render() {
    ctx.save();
    if (shake > 0) ctx.translate(Math.round((Math.random() - 0.5) * 6), 0);
    ctx.drawImage(bg, 0, 0);

    // 피버: 바닥이 번쩍번쩍
    if (fever > 0) {
      const hue = (performance.now() / 4) % 360;
      ctx.fillStyle = 'hsla(' + hue + ',100%,60%,0.22)';
      ctx.fillRect(0, 120, W, 126);
    }

    // 뒤에 선 손님부터 그린다
    for (let i = queue.length - 1; i >= 0; i--) {
      const c = queue[i], sl = slotAt(c.pos);
      const bob = i === 0 ? Math.round(Math.sin(c.bob * 5) * 1) : 0;
      const fade = Math.min(1, (SLOTS.length - 1 + 0.6 - c.pos) / 0.6 + 0.0001);
      drawPerson(c, 90, sl.y + bob, sl.s, 'normal', i === SLOTS.length - 1 ? Math.max(0, fade) : 1);
    }
    // 떠나는 손님: 기쁘면 오른쪽, 화나면 왼쪽으로 사라진다
    for (const c of leaving) {
      const k = c.t / 0.5, dir = c.mood === 'happy' ? 1 : -1;
      const sl = SLOTS[0];
      const hop = c.mood === 'happy' ? Math.round(Math.sin(k * Math.PI) * 10) : 0;
      drawPerson(c, 90 + dir * k * 110, sl.y - hop, sl.s, c.mood, 1 - k * 0.6);
      if (c.mood === 'angry') pixelText('!', 90 + dir * k * 110 + 22, sl.y - 104, 3, '#ff3b3b', '#2b1a12');
    }
    // 맨 앞 손님 말풍선
    const front = queue[0];
    if (front && front.pos < 0.3 && state === 'play') {
      drawBubble(front, SLOTS[0].y - SPRITE_H * SLOTS[0].s);
    }

    // 효과
    for (const e of effects) {
      const k = e.t / e.life;
      if (e.kind === 'fire') drawFire(e);
      if (e.kind === 'text') {
        const s = e.s, x = e.center ? Math.round(e.x - textWidth(e.text, s) / 2) : e.x;
        ctx.globalAlpha = 1 - Math.max(0, k - 0.6) / 0.4;
        pixelText(e.text, x, Math.round(e.y - k * 10), s, e.color, '#2b1a12');
        ctx.globalAlpha = 1;
      }
      if (e.kind === 'fly') {
        const im = RAMEN[e.type].icon;
        const x = e.x0 + (e.x1 - e.x0) * k, y = e.y0 + (e.y1 - e.y0) * k - Math.sin(k * Math.PI) * 30;
        const s = 2 - k;
        drawSmooth(im, x, y, 24 * s, 24 * s);
      }
    }

    if (state !== 'title') drawHUD();
    if (fever > 0) {
      pixelText('FEVER ' + Math.ceil(fever), W / 2 - textWidth('FEVER ' + Math.ceil(fever), 2) / 2, 8, 2, '#ff4fd8', '#2b1a12');
    }
    ctx.restore();
  }

  let last = 0;
  function frame(now) {
    const dt = last ? Math.min(0.05, (now - last) / 1000) : 0;
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  // 시작 화면 뒤에도 손님 줄이 보이게
  for (let i = 0; i < SLOTS.length; i++) { const c = newCustomer(); c.pos = i; queue.push(c); }
  requestAnimationFrame(frame);

  // 시험용 (개발자 도구에서 상태 확인)
  window.__game = { get state() { return state; }, get served() { return served; }, get combo() { return combo; },
    get timeLeft() { return timeLeft; }, get feverCount() { return feverCount; }, get lockTime() { return lockTime; }, get fever() { return fever; }, get want() { const c = queue[0]; return c && (c.need.A ? 'A' : c.need.B ? 'B' : null); },
    get front() { return queue[0]; },
    get patience() { return queue[0] && queue[0].patience; }, serve, startGame,
    step(sec) { for (let t = 0; t < sec; t += 1 / 60) update(1 / 60); render(); } };
})();
</script>
</body>
